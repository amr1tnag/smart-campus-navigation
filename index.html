<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Navigation</title>

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

<header class="main-header">
  <div class="header-left">
    <img src="University Logo.png" class="logo" />
    <div class="branding">
      <h1>D.Y. PATIL UNIVERSITY</h1>
      <p>Smart Campus Navigation</p>
    </div>
  </div>
</header>

<div id="map-container">
  <div id="map"></div>

  <div id="controls">
    <div class="control-content">
      <div class="panel-heading">
        <div>
          <p>Route Planner</p>
          <span>Choose two campus locations</span>
        </div>
        <button
          type="button"
          id="panelToggle"
          class="panel-toggle"
          aria-expanded="true"
          aria-controls="panelBody"
        >
          Collapse
        </button>
      </div>

      <div id="panelBody" class="panel-body">
        <label>Start Location</label>
        <select id="start"></select>

        <label>End Location</label>
        <select id="end"></select>

        <button id="swapRoute" class="secondary-action" type="button">Swap Start and End</button>

        <div class="route-actions">
          <button id="findRoute" type="button">Find Route</button>
          <button id="clearRoute" class="secondary-action" type="button">Clear Route</button>
        </div>

        <!-- RESULT -->
        <div class="route-info">
          <p><span class="label">Distance</span><span id="distance">-</span></p>
          <p><span class="label">Time</span><span id="time">-</span></p>
        </div>

        <!-- DIRECTIONS -->
        <div class="route-info">
          <p id="stepText">Click Find Route</p>

          <div class="nav-buttons">
            <button id="prevStep" class="nav-btn">Prev Step</button>
            <button id="nextStep" class="nav-btn primary">Next Step</button>
          </div>
          <div class="voice-toggle">
            <span>Voice Navigation</span>

            <label class="switch">
              <input type="checkbox" id="voiceToggle">
              <span class="slider"></span>
            </label>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/graph.js"></script>
<script src="js/algorithms.js"></script>
<script src="js/app.js"></script>

<script>
  var map = L.map('map').setView([19.0443, 73.0245], 17);

  L.tileLayer("https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=YmEOZSxLEE87oOVe10Ps", {
    maxZoom: 22,
  }).addTo(map);
</script>

</body>
</html>
