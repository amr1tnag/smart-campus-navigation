<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Navigation</title>

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#711616" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Campus Nav" />
</head>

<body>

<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<header class="main-header">
  <div class="header-left">
    <img src="University Logo.png" class="logo" alt="D.Y. Patil University Logo" />
    <div class="branding">
      <h1>D.Y. PATIL UNIVERSITY</h1>
      <p>Smart Campus Navigation</p>
    </div>
  </div>
</header>

<div id="map-container">
  <div id="map"></div>

  <div id="controls">
    <div class="drag-handle" id="dragHandle"></div>
    <div class="control-content">
      <div class="panel-heading">
        <div class="panel-heading-default">
          <p>Route Planner</p>
          <span>Choose two campus locations</span>
        </div>
        <div class="panel-heading-mini" id="miniNav">
          <button id="miniPrev" class="mini-nav-btn" aria-label="Previous step">&#8592;</button>
          <span id="miniStepText" class="mini-step-text"></span>
          <button id="miniNext" class="mini-nav-btn primary" aria-label="Next step">&#8594;</button>
        </div>
        <button
          type="button"
          id="panelToggle"
          class="panel-toggle"
          aria-expanded="true"
          aria-controls="panelBody"
        >
          Collapse
        </button>
      </div>

      <div id="panelBody" class="panel-body">

        <!-- RECENT ROUTES -->
        <div id="recentRoutes" hidden>
          <p class="recent-label">Recent</p>
          <div class="recent-chips" id="recentChips"></div>
        </div>

        <label for="start">Start Location</label>
        <div class="location-input-wrap">
          <input
            type="text"
            id="start"
            placeholder="Search start location…"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="start-dropdown"
          />
          <button id="gpsBtn" class="gps-btn" type="button" title="Use my location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 2"/></svg>
          </button>
          <div class="autocomplete-list" id="start-dropdown" role="listbox"></div>
        </div>

        <label for="end">End Location</label>
        <div class="location-input-wrap">
          <input
            type="text"
            id="end"
            placeholder="Search or tap map…"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="end-dropdown"
          />
          <div class="autocomplete-list" id="end-dropdown" role="listbox"></div>
        </div>
        <p class="tap-hint" id="tapHint">Tip: tap the map to set destination</p>

        <button id="swapRoute" class="secondary-action" type="button">⇅ Swap</button>

        <div class="route-actions">
          <button id="findRoute" type="button">Find Route</button>
          <button id="clearRoute" class="secondary-action" type="button">Clear</button>
        </div>

        <button id="shareBtn" class="share-btn secondary-action" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Share Route
        </button>

        <!-- RESULT -->
        <div class="route-info" id="routeStats" hidden>
          <p><span class="label">Distance</span><span id="distance">-</span></p>
          <p><span class="label">Est. Time</span><span id="time">-</span></p>
        </div>

        <!-- DIRECTIONS -->
        <div class="route-info directions-card" id="directionsCard" hidden>
          <div class="step-header">
            <span id="stepCounter" class="step-counter"></span>
            <div class="voice-toggle">
              <span>Voice</span>
              <label class="switch">
                <input type="checkbox" id="voiceToggle">
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <p id="stepText">Click Find Route</p>

          <div class="nav-buttons">
            <button id="prevStep" class="nav-btn" disabled>← Prev</button>
            <button id="nextStep" class="nav-btn primary" disabled>Next →</button>
          </div>

          <details class="all-steps-details" id="allStepsDetails">
            <summary>All Directions</summary>
            <ol id="allStepsList"></ol>
          </details>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/graph.js"></script>
<script src="js/algorithms.js"></script>
<script src="js/app.js"></script>

<script>
  var map = L.map('map', { zoomControl: true, tap: true }).setView([19.0443, 73.0245], 17);

  L.tileLayer("https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=YmEOZSxLEE87oOVe10Ps", {
    maxZoom: 22,
  }).addTo(map);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  map.on('click', function(e) {
    if (!window.tapMode) return;
    const endInput = document.getElementById('end');
    const lat = e.latlng.lat.toFixed(5);
    const lng = e.latlng.lng.toFixed(5);

    if (window.tapMarker) map.removeLayer(window.tapMarker);
    window.tapMarker = L.marker(e.latlng, {
      icon: L.divIcon({
        className: '',
        html: '<div style="width:14px;height:14px;background:#8d1f1f;border:3px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.4)"></div>',
        iconAnchor: [7, 7]
      })
    }).addTo(map);

    endInput.value = `Pin (${lat}, ${lng})`;
    window._tapCoords = e.latlng;
    endInput.blur();
  });
</script>

</body>
</html>
